[project]
name = "newsradio"
version = "0.1.0"
description = "Automated 24/7 news radio: Telegram/RSS -> dedup -> LLM editor -> TTS -> stream"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "feedparser>=6.0",
    "trafilatura>=1.8",
    "beautifulsoup4>=4.12",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "anthropic>=0.40",
    "edge-tts>=6.1",
    "num2words>=0.5.13",
]

[project.optional-dependencies]
# Multilingual embeddings for story clustering (recommended)
embeddings = ["sentence-transformers>=3.0"]
# Local TTS (Apache-2.0, runs on Apple Silicon / CPU)
kokoro = ["kokoro>=0.9", "soundfile>=0.12"]
postgres = ["psycopg[binary]>=3.2"]
telegram = ["telethon>=1.36,<2"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["newsradio*"]

[tool.setuptools.package-data]
newsradio = ["static/*"]
