services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: newsradio
      POSTGRES_DB: newsradio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newsradio"]
      interval: 5s
      retries: 10
  radio:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://newsradio:${POSTGRES_PASSWORD}@postgres:5432/newsradio
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
